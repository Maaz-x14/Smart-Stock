name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: smartstock
          POSTGRES_PASSWORD: smartstock
          POSTGRES_DB: smartstock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartstock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://smartstock:smartstock@localhost:5432/smartstock_test
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        # No PaddleOCR/PaddlePaddle here - tests mock run_ocr() (see
        # tests/conftest.py), and ml_service/ocr/model.py imports
        # paddleocr lazily, so nothing in the test run needs it.
        run: pip install -r requirements-ci.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Check models match migrations (no drift)
        run: alembic check
      - name: Run tests
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (not pushed)
        run: docker build -t smart-stock-api:ci .
