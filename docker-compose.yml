# Local dev only. Brings up Postgres + the API; the frontend runs
# separately via `npm run dev` (frontend/vite.config.ts proxies
# /api/v1 to this API's :8000).
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: smartstock
      POSTGRES_PASSWORD: smartstock
      POSTGRES_DB: smartstock
    ports:
      - "5432:5432"
    volumes:
      - smart_stock_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartstock"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://smartstock:smartstock@db:5432/smartstock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  smart_stock_db_data:
